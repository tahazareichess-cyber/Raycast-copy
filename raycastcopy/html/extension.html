<section class="extension">
    <div class="extension-container">

        <div class="extension-top">

            <div class="extension-text">
                <h2>There’s an extension for that.</h2>
                <p>Use your favorite tools without even opening them.</p>
            </div>

            <div class="extension-tabs">
                <button class="active" id="productivity">Productivity</button>
                <button id="engineering">Engineering</button>
                <button id="design">Design</button>
                <button id="writing">Writing</button>
            </div>

        </div> 
    <div class="extension-slider">
        <div class="extension-cards">
            <article class="extension-card-more">
                <img src="raycastcopy/img/more-extensions.webp" alt="">
                <div class="extension-card-more-text">
                    <h3>Plus a thousend more...</h3>
                    <p>brows the store <ion-icon name="arrow-forward-outline"></ion-icon></p>
                </div>
            </article>
        </div>
    </div>


        <div class="extension-foot">

            <div class="extension-foot-text">
                <p>Browse thousands more
                    <span><ion-icon name="chevron-forward-sharp"></ion-icon></span>
                </p>
            </div>

            <div class="extension-foot-button">
                <button id="prevButton"><ion-icon name="chevron-back-sharp"></ion-icon></button>
                <button id="nextButton"><ion-icon name="chevron-forward-sharp"></ion-icon></button>
            </div>

        </div>

    </div>
</section>
